<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Cupid AI - API Documentation & Swagger UI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" type="text/css" href="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui.css" />
  <link rel="icon" type="image/png" href="https://img.icons8.com/color/48/heart-with-arrow.png" />
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .cupid-header {
      background: linear-gradient(135deg, #ff4b72 0%, #ff6b8b 50%, #9055ff 100%);
      color: white;
      padding: 24px 32px;
      box-shadow: 0 4px 20px rgba(255, 75, 114, 0.25);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }
    .cupid-brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .cupid-logo {
      font-size: 38px;
      line-height: 1;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.2));
    }
    .cupid-title h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .cupid-title p {
      margin: 4px 0 0 0;
      font-size: 13px;
      opacity: 0.92;
    }
    .cupid-badges {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .badge {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(8px);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    #swagger-ui {
      max-width: 1280px;
      margin: 0 auto;
      padding: 24px 16px;
    }
    .swagger-ui .topbar { display: none; }
    .swagger-ui .info { margin: 20px 0; }
    .swagger-ui .opblock.opblock-post { border-color: #49cc90; }
    .swagger-ui .btn.authorize {
      background: #ff4b72;
      border-color: #ff4b72;
      color: #fff;
    }
    .swagger-ui .btn.authorize svg { fill: #fff; }
  </style>
</head>
<body>
  <header class="cupid-header">
    <div class="cupid-brand">
      <div class="cupid-logo">💘</div>
      <div class="cupid-title">
        <h1>Cupid AI Dating Platform</h1>
        <p>Interactive OpenAPI 3.0 / Swagger Interactive Playground</p>
      </div>
    </div>
    <div class="cupid-badges">
      <span class="badge">OpenAPI 3.0.3</span>
      <span class="badge">Dual JWT Auth</span>
      <span class="badge">Socket.io 4.8</span>
      <span class="badge">Google Gemini AI</span>
      <span class="badge">PostgreSQL 16 + Prisma</span>
    </div>
  </header>

  <div id="swagger-ui"></div>

  <script src="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-bundle.js"></script>
  <script src="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-standalone-preset.js"></script>
  <script>
    window.onload = function() {
      window.ui = SwaggerUIBundle({
        url: "./openapi.json",
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        plugins: [
          SwaggerUIBundle.plugins.DownloadUrl
        ],
        layout: "BaseLayout",
        defaultModelsExpandDepth: 1,
        defaultModelExpandDepth: 1,
        docExpansion: "list",
        filter: true,
        showExtensions: true,
        showCommonExtensions: true,
        persistAuthorization: true
      });
    };
  </script>
</body>
</html>
